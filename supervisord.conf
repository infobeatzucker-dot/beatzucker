[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

; ── Next.js ──────────────────────────────────────────────────────────────────
[program:nextjs]
command=node server.js
directory=/app
environment=PORT="3000",NODE_ENV="production",HOSTNAME="0.0.0.0"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; ── Temp-file cleanup (1h originals; 25h physical grace for 24h downloads) ──
[program:cleanup]
command=/bin/sh -c 'while true; do find /app/uploads -maxdepth 1 -type f ! -name "*.db" ! -name "*.db-*" -mmin +60 -delete 2>/dev/null; find /app/uploads/masters -maxdepth 1 -type f -mmin +1500 -delete 2>/dev/null; sleep 3600; done'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5

; ── Python FastAPI ───────────────────────────────────────────────────────────
[program:python]
command=uvicorn main:app --host 127.0.0.1 --port 8001 --workers 1
directory=/app/python
environment=NODE_ENV="production",PYTHONUNBUFFERED="1",NUMBA_CACHE_DIR="/home/appuser/.cache/numba",HOME="/home/appuser"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
